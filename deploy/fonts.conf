<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig for the distroless image: it has no fontconfig data of its own,
     and libass draws no text at all without a configuration. DejaVu Sans is
     the face of a font that is not installed (what the reference answers),
     WenQuanYi Zen Hei the one of CJK text. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
