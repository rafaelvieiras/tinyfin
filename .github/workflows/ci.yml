name: CI

# Builds, vets and tests every push and pull request. The end-to-end browser
# suite (e2e/) and the conformance run against a reference server need a
# running server and real media, so they are run by hand (see AGENTS.md).
# The conformance ratchet against a throwaway Tinyfin runs here (job below).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, vet, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Contract clean-room lint
        run: go run ./cmd/conformance lint

  conformance:
    name: Conformance ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate the synthetic media tree
        run: scripts/conformance-media.sh "$RUNNER_TEMP/media"
      - name: Start a throwaway Tinyfin
        id: tf
        # Listens on the runner's own address (not loopback) so the server can
        # see the runner as a non-loopback peer; the data dir is where it
        # writes the password-reset PIN files.
        run: |
          ip="$(hostname -I | awk '{print $1}')"
          BIND="$ip" scripts/conformance-tinyfin-up.sh 18098 | tee "$RUNNER_TEMP/up.log"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "dir=$(sed -n 's/.*data-dir=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/up.log")" >> "$GITHUB_OUTPUT"
      - name: Compare against the committed baseline
        # Fails only when a scenario that passes in docs/contract/baseline.json
        # no longer passes. The throwaway admin credential is the script default.
        run: |
          go run ./cmd/conformance run -base "http://${{ steps.tf.outputs.ip }}:18098" \
            -admin-user admin -admin-pass 'Conformance-Admin-1' \
            -media-root "$RUNNER_TEMP/media" \
            -server-data-dir "${{ steps.tf.outputs.dir }}" \
            -baseline docs/contract/baseline.json -skip-tags time-dependent,expiry -device-suffix auto
      - name: Start a second throwaway Tinyfin for the risky scenarios
        id: tf2
        run: |
          BIND="${{ steps.tf.outputs.ip }}" scripts/conformance-tinyfin-up.sh 18099 | tee "$RUNNER_TEMP/up2.log"
          echo "dir=$(sed -n 's/.*data-dir=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/up2.log")" >> "$GITHUB_OUTPUT"
      - name: Risky scenarios (last administrator, PIN throttle)
        # They may delete/demote the only administrator or leave the runner's
        # address throttled, so they get a server of their own and run alone.
        # -strict: a BLOCKED scenario fails this step too.
        run: |
          go run ./cmd/conformance run -base "http://${{ steps.tf.outputs.ip }}:18099" \
            -admin-user admin -admin-pass 'Conformance-Admin-1' \
            -media-root "$RUNNER_TEMP/media" \
            -server-data-dir "${{ steps.tf2.outputs.dir }}" \
            -tags risky -risky -strict -device-suffix auto
