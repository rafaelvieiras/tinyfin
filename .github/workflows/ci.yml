name: CI

# Every push and pull request. The end-to-end browser suite (e2e/) and a run
# against a reference server need a running server and real media, so they are
# run by hand (see AGENTS.md); what the conformance ratchet needs -- a throwaway
# Tinyfin, the synthetic media tree and the ffmpeg the fixtures are calibrated
# on -- is built here.
#
# The shape comes from measurement. On a pull request before the split the whole
# thing was one job: 33 m 07 s, of which 30 m 01 s was one serial run of 921
# scenarios, 2 m 01 s the media tree, 35 s apt, and the rest noise (a second
# measurement of the same commit took 45 m 44 s, so a faster machine is not the
# answer). Now:
#
#   Format, vet, contract   30 s   answers without compiling anything
#   Build, test             1 m 52
#   conformance (7 jobs)    ~5-8 m   the 921 scenarios dealt across six servers,
#                                   plus the risky ones alone
#
# and every job starts at once: nothing waits for another job's artifact,
# because the media tree and the tool packages come from the branch's cache,
# which all jobs share. Wall time is the slowest job, not the sum.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The portable build the image ships (see the JELLYFIN_FFMPEG_VERSION build
  # arg). The unit tests transcode with it, so they have to run against this
  # build and not whatever the runner happens to have.
  JELLYFIN_FFMPEG_PORTABLE: v7.1.4-3
  # Bumped when the media tree has to be rebuilt even though its scripts did not
  # change (a new fixture that changes an existing file, a calibration change).
  MEDIA_TREE_REV: v1

jobs:
  lint:
    name: Format, vet, contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # No `cache: true`: this job compiles almost nothing, and restoring a
          # 400 MB build cache to run gofmt costs more than it saves.
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Contract clean-room lint
        run: go run ./cmd/conformance lint
      - name: Coverage tracker is valid and up to date
        run: go run ./cmd/conformance coverage -check

  test:
    name: Build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Restore the portable jellyfin-ffmpeg
        # Keyed on the version: the tarball is 60 MB and immutable, so a warm
        # cache turns the download into a copy out of ~/.cache.
        id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jellyfin-ffmpeg/${{ env.JELLYFIN_FFMPEG_PORTABLE }}.tar.xz
          key: jellyfin-ffmpeg-${{ runner.os }}-${{ env.JELLYFIN_FFMPEG_PORTABLE }}
      - name: Install jellyfin-ffmpeg
        run: |
          tarball="$HOME/.cache/jellyfin-ffmpeg/${JELLYFIN_FFMPEG_PORTABLE}.tar.xz"
          if [ ! -s "$tarball" ]; then
            mkdir -p "$(dirname "$tarball")"
            curl -fsSL -o "$tarball" \
              "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/${JELLYFIN_FFMPEG_PORTABLE}/jellyfin-ffmpeg_${JELLYFIN_FFMPEG_PORTABLE#v}_portable_linux64-gpl.tar.xz"
          fi
          sudo mkdir -p /usr/local/lib/jellyfin-ffmpeg
          sudo tar -xJf "$tarball" -C /usr/local/lib/jellyfin-ffmpeg
          sudo chmod +x /usr/local/lib/jellyfin-ffmpeg/ffmpeg /usr/local/lib/jellyfin-ffmpeg/ffprobe
          echo /usr/local/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
          /usr/local/lib/jellyfin-ffmpeg/ffmpeg -version | head -1
      - name: Save the portable jellyfin-ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jellyfin-ffmpeg/${{ env.JELLYFIN_FFMPEG_PORTABLE }}.tar.xz
          key: jellyfin-ffmpeg-${{ runner.os }}-${{ env.JELLYFIN_FFMPEG_PORTABLE }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  # One job per shard, plus the risky scenarios as one more entry: they need a
  # server of their own too (they may demote the last administrator or throttle
  # the runner's address), so they are a sibling job rather than a step after
  # the others. This way all seven start together.
  #
  # Which file goes to which shard is docs/contract/shards.json, weighted by the
  # minutes each file measured; the runner refuses a plan that does not match
  # the count below and go test ./internal/conformance refuses one that misses a
  # scenario file. Regenerate it from a report of a full run when the suite
  # changes: go run ./cmd/conformance shards -report run.json -n 6 -write
  # docs/contract/shards.json
  conformance:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One red shard must not hide the others: a failure anywhere is seen
      # before the run ends.
      fail-fast: false
      matrix:
        include:
          - name: Conformance shard 1/6
            shard: 1/6
          - name: Conformance shard 2/6
            shard: 2/6
          - name: Conformance shard 3/6
            shard: 3/6
          - name: Conformance shard 4/6
            shard: 4/6
          - name: Conformance shard 5/6
            shard: 5/6
          - name: Conformance shard 6/6
            shard: 6/6
          - name: Risky scenarios
            shard: risky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install the server's tools
        uses: ./.github/actions/jellyfin-tools
      - name: Media tree
        uses: ./.github/actions/media-tree
        with:
          revision: ${{ env.MEDIA_TREE_REV }}
      - name: Note the runner address
        id: net
        # The server listens on the runner's own address (not loopback) so it
        # sees a non-loopback peer, which users.auth.R21 needs.
        run: echo "ip=$(hostname -I | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Serve the media the .strm fixtures point at
        if: matrix.shard != 'risky'
        # playback.offer.strm-http, playback.offer.strm-mkv,
        # playback.offer.mp4-container-names and
        # policy.remote.force-source-transcoding read the container of the
        # file behind the address; without a listener they see the .strm file
        # itself and answer "strm".
        run: scripts/conformance-strm-serve.sh "$RUNNER_TEMP/media" 18999
      - name: Start a throwaway Tinyfin
        id: tf
        # Every job gets its own server and its own data dir: the suite is dealt
        # by file, so no scenario of one job depends on another's state. The
        # data dir is also where the server writes the password-reset PIN files.
        run: |
          BIND="${{ steps.net.outputs.ip }}" scripts/conformance-tinyfin-up.sh 18098 | tee "$RUNNER_TEMP/up.log"
          echo "dir=$(sed -n 's/.*data-dir=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/up.log")" >> "$GITHUB_OUTPUT"
      - name: Compare against the committed baseline
        if: matrix.shard != 'risky'
        # Fails only when a scenario that passes in docs/contract/baseline.json
        # no longer passes; each shard compares its own share against the same
        # file. The throwaway admin credential is the script default.
        # -retry-failed 1: a scenario that reads state the server builds in the
        # background (an auto-built collection, a frame still being extracted)
        # gets one more attempt after everything else ran. The run prints RETRY
        # with the first failure, so a flake stays visible.
        run: |
          go run ./cmd/conformance run -base "http://${{ steps.net.outputs.ip }}:18098" \
            -admin-user admin -admin-pass 'Conformance-Admin-1' \
            -media-root "$RUNNER_TEMP/media" -media-local-root "$RUNNER_TEMP/media" \
            -server-data-dir "${{ steps.tf.outputs.dir }}" \
            -baseline docs/contract/baseline.json -skip-tags time-dependent,expiry,risky \
            -device-suffix auto -shard "${{ matrix.shard }}" -retry-failed 1
      - name: Risky scenarios (last administrator, PIN throttle)
        if: matrix.shard == 'risky'
        # -strict: a BLOCKED scenario fails this step too.
        run: |
          go run ./cmd/conformance run -base "http://${{ steps.net.outputs.ip }}:18098" \
            -admin-user admin -admin-pass 'Conformance-Admin-1' \
            -media-root "$RUNNER_TEMP/media" \
            -server-data-dir "${{ steps.tf.outputs.dir }}" \
            -tags risky -risky -strict -device-suffix auto
