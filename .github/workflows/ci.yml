name: CI

# Builds, vets and tests every push and pull request. The end-to-end browser
# suite (e2e/) and the conformance run against a reference server need a
# running server and real media, so they are run by hand (see AGENTS.md).
# The conformance ratchet against a throwaway Tinyfin runs here (job below).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, vet, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install jellyfin-ffmpeg
        # The image bundles the portable jellyfin-ffmpeg release (see the
        # JELLYFIN_FFMPEG_VERSION build arg), so the suite runs against the
        # build that ships: transcoding fixtures, key frames, segments and the
        # burn-in all read the ffmpeg of $PATH.
        run: |
          curl -fsSL -o /tmp/jellyfin-ffmpeg.tar.xz \
            "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v7.1.4-3/jellyfin-ffmpeg_7.1.4-3_portable_linux64-gpl.tar.xz"
          sudo mkdir -p /usr/local/lib/jellyfin-ffmpeg
          sudo tar -xJf /tmp/jellyfin-ffmpeg.tar.xz -C /usr/local/lib/jellyfin-ffmpeg
          sudo chmod +x /usr/local/lib/jellyfin-ffmpeg/ffmpeg /usr/local/lib/jellyfin-ffmpeg/ffprobe
          echo /usr/local/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
          /usr/local/lib/jellyfin-ffmpeg/ffmpeg -version | head -1
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Contract clean-room lint
        run: go run ./cmd/conformance lint
      - name: Coverage tracker is valid and up to date
        run: go run ./cmd/conformance coverage -check

  conformance:
    name: Conformance ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install the tools the media tree and the server need
        # jellyfin-ffmpeg is the build the reference itself runs, and the
        # fixtures, the expected timestamps and the expected bit rates are
        # calibrated on it: the tree is byte-identical, the burn fixtures need
        # its noise bsf, and only it reports HDR10+ side data. It installs to
        # /usr/lib/jellyfin-ffmpeg, which is also the server's default path.
        # mkvtoolnix makes the Matroska statistics and Dolby Vision remuxes;
        # xorriso makes the DVD image fixture.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg ffmpeg mkvtoolnix xorriso
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/jellyfin.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/jellyfin.gpg] https://repo.jellyfin.org/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/jellyfin.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jellyfin-ffmpeg8
          # The server and the runner both read these: the server falls back to
          # the ffmpeg of $PATH otherwise, and the runner reports the burn
          # fixtures BLOCKED when it cannot ask the ffmpeg for its noise bsf.
          # The distro ffmpeg stays first in $PATH on purpose: the fixtures are
          # pinned to the bytes the reference's own build writes, which the
          # media scripts take from the Jellyfin container image (8.1.3) and not
          # from the package, and playback9's rates follow those bytes.
          echo TINYFIN_FFMPEG_PATH=/usr/lib/jellyfin-ffmpeg/ffmpeg >> "$GITHUB_ENV"
          echo TINYFIN_FFPROBE_PATH=/usr/lib/jellyfin-ffmpeg/ffprobe >> "$GITHUB_ENV"
          /usr/lib/jellyfin-ffmpeg/ffmpeg -version | head -1
      - name: Note the runner address
        id: net
        # The server listens on the runner's own address (not loopback) so it
        # sees a non-loopback peer, which users.auth.R21 needs.
        run: echo "ip=$(hostname -I | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Generate the synthetic media tree
        # The .strm fixtures point at the address the next step serves on; the
        # default is the Docker bridge gateway, which suits a server in a
        # container, and here the server is on the host beside the runner.
        env:
          STRM_HTTP: http://127.0.0.1:18999
        run: scripts/conformance-media.sh "$RUNNER_TEMP/media"
      - name: Serve the media the .strm fixtures point at
        # playback.offer.strm-http, playback.offer.strm-mkv,
        # playback.offer.mp4-container-names and
        # policy.remote.force-source-transcoding read the container of the
        # file behind the address; without a listener they see the .strm file
        # itself and answer "strm".
        run: scripts/conformance-strm-serve.sh "$RUNNER_TEMP/media" 18999
      - name: Note what the bit rate fixture holds
        # TEMPORARY diagnostic: the recorded rates of playback9 follow these
        # bytes and this measurement.
        run: |
          f="$RUNNER_TEMP/media/Probe3/P3 Ts Aac (3801)/P3 Ts Aac (3801).ts"
          ls -l "$f"
          /usr/lib/jellyfin-ffmpeg/ffprobe -v error -threads 0 -probesize 1000000000 \
            -analyzeduration 200000000 -print_format json -show_format -show_streams \
            -show_frames -only_first_vframe "$f" \
            | grep -oE '"(bit_rate|size|duration)": *"[0-9.]*"' | head -8
      - name: Start a throwaway Tinyfin
        id: tf
        # The data dir is where the server writes the password-reset PIN files.
        run: |
          BIND="${{ steps.net.outputs.ip }}" scripts/conformance-tinyfin-up.sh 18098 | tee "$RUNNER_TEMP/up.log"
          echo "dir=$(sed -n 's/.*data-dir=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/up.log")" >> "$GITHUB_OUTPUT"
      - name: Compare against the committed baseline
        # Fails only when a scenario that passes in docs/contract/baseline.json
        # no longer passes. The throwaway admin credential is the script default.
        run: |
          go run ./cmd/conformance run -base "http://${{ steps.net.outputs.ip }}:18098" \
            -admin-user admin -admin-pass 'Conformance-Admin-1' \
            -media-root "$RUNNER_TEMP/media" -media-local-root "$RUNNER_TEMP/media" \
            -server-data-dir "${{ steps.tf.outputs.dir }}" \
            -baseline docs/contract/baseline.json -skip-tags time-dependent,expiry,risky -device-suffix auto
      - name: Start a second throwaway Tinyfin for the risky scenarios
        id: tf2
        run: |
          BIND="${{ steps.net.outputs.ip }}" scripts/conformance-tinyfin-up.sh 18099 | tee "$RUNNER_TEMP/up2.log"
          echo "dir=$(sed -n 's/.*data-dir=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/up2.log")" >> "$GITHUB_OUTPUT"
      - name: Risky scenarios (last administrator, PIN throttle)
        # They may delete/demote the only administrator or leave the runner's
        # address throttled, so they get a server of their own and run alone.
        # -strict: a BLOCKED scenario fails this step too.
        run: |
          go run ./cmd/conformance run -base "http://${{ steps.net.outputs.ip }}:18099" \
            -admin-user admin -admin-pass 'Conformance-Admin-1' \
            -media-root "$RUNNER_TEMP/media" \
            -server-data-dir "${{ steps.tf2.outputs.dir }}" \
            -tags risky -risky -strict -device-suffix auto
